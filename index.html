<!doctype html>
<html lang="en" class="dark" data-color-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f10" />
    <!-- Vite injects the code-controlled release flag before styles paint.
         Keep the key/default aligned with features/appearance/appearance.ts. -->
    <script>
      (() => {
        if (!__COLOR_MODE_ENABLED__) return;
        let mode = 'dark';
        try { mode = localStorage.getItem('pull-prix:color-mode'); } catch {}
        const light = mode === 'light' || (mode === 'system' && !window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.colorMode = light ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark', !light);
        document.querySelector('meta[name="theme-color"]').content = light ? '#f5f7f4' : '#0d0f10';
      })();
    </script>
    <title>Pull Prix — Turn PR Reviews Into Race Day</title>
    <meta name="description" content="Turn thoughtful code reviews into friendly competition. Pull Prix brings your GitHub team together with seasonal championships, live standings, and shared progress." />
    <!-- Static metadata is available to link crawlers without JavaScript or sign-in.
         Keep shared previews generic: never expose private team names or scores.
         No global og:url/canonical: preserve the actual shared team destination. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pull Prix" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Pull Prix — Turn PR Reviews Into Race Day" />
    <meta property="og:description" content="Great reviews. Friendly competition. Bring your GitHub team together for a season worth showing up for." />
    <meta property="og:image" content="https://www.pullprix.com/social/pull-prix-v1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pull Prix logo, a glowing race circuit, and the words Turn PR reviews into race day." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pull Prix — Turn PR Reviews Into Race Day" />
    <meta name="twitter:description" content="Great reviews. Friendly competition. Bring your GitHub team together for a season worth showing up for." />
    <meta name="twitter:image" content="https://www.pullprix.com/social/pull-prix-v1.png" />
    <meta name="twitter:image:alt" content="Pull Prix logo, a glowing race circuit, and the words Turn PR reviews into race day." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
